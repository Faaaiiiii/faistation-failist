<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurel — mockup hero v2b (precision)</title>
<meta name="description" content="Mockup hero statik untuk arah visual Aurel v2b — panel instrumen presisi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   AUREL v2b — mockup hero (STATIC, no animation). Direction: "precision panel".
   Register: systems & data — a cool near-black instrument surface, one brand
   cyan signal held at ≤10%, mono state labels, a live signal line, a readout.
   Tokens + reasons: design/COMMIT-SHEET.md. Refs: design/refs/REFERENCES.md.
   ========================================================================== */
:root{
  --field:    #0A0C10;   /* cool near-black (oklch .155 .012 245) — NOT warm ink, NOT navy */
  --surface:  #12161D;   /* raised panel */
  --ink:      #EEF1F5;   /* 16.9:1 on field */
  --ink-2:    #C3CBD4;   /* counter-line, 11.6:1 */
  --muted:    #9AA6B3;   /* meta, 7.2:1 */
  --rule:     #232B34;   /* hairline structure, not text */
  --rule-2:   #333C47;   /* tick marks */
  --signal:   #48C2E1;   /* ⚠ the brand's own cyan from logo-titik.svg — the ONE signal, ≤10% */
  --mark-ink: #EEF1F5;

  --font: "Schibsted Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono: "JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;

  --fs-state: clamp(2.55rem, 6.3vw, 5.4rem);
  --fs-lede:  clamp(1.0rem, 1.1vw, 1.2rem);
  --fs-meta:  0.8125rem;   /* 13px mono label — above the 12px floor */

  --pad-m: clamp(20px, 4.2vw, 64px);
  --gut:   clamp(20px, 3.4vw, 52px);
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--field); }
body{
  color:var(--ink); font-family:var(--font); font-weight:400;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}

.panel{ position:relative; min-height:100svh; overflow:clip;
  display:flex; flex-direction:column; background:var(--field);
  padding:0 0 clamp(22px,3.4vw,44px); }

/* full-bleed instrument rule (the grid-break: it escapes the page margin) */
.ruler{ height:34px; display:flex; align-items:flex-end; gap:14px;
  padding:0 var(--pad-m) 9px; border-bottom:1px solid var(--rule); }
.ruler .ticks{ flex:0 0 auto; width:min(38vw,420px); height:9px; color:var(--rule-2); }
.ruler .rl{ font-family:var(--mono); font-weight:500; font-size:var(--fs-meta);
  letter-spacing:0.02em; color:var(--muted); text-transform:uppercase; }
.ruler .rl.rt{ margin-left:auto; }

.stage{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  padding:clamp(26px,4vw,56px) var(--pad-m) 0; gap:clamp(26px,4vw,54px); }

/* asymmetric 4 / 8 split: mono readout rail | statement */
.grid{ display:grid; grid-template-columns:minmax(0,1fr); gap:var(--gut); flex:1 1 auto; }

.rail{ display:flex; flex-direction:column; gap:14px; align-self:start; }
.rail-row{ display:flex; align-items:baseline; gap:10px;
  font-family:var(--mono); font-size:var(--fs-meta); }
.rail-row .k{ color:var(--muted); text-transform:uppercase; letter-spacing:0.02em; }
.rail-row .leader{ flex:1 1 auto; height:1px; background:var(--rule);
  transform:translateY(-0.28em); }
.rail-row .v{ color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; }
.rail-row.status{ margin-top:10px; padding-top:14px; border-top:1px solid var(--rule); }
.rail-row.status .v{ color:var(--signal); }
.dot{ width:8px; height:8px; border-radius:50%; background:var(--signal); flex:0 0 auto;
  transform:translateY(-1px); }

.lead{ display:flex; flex-direction:column; gap:clamp(16px,2.2vw,26px); align-self:end; }
.statement{ margin:0; font-weight:600; font-size:var(--fs-state);
  line-height:0.98; letter-spacing:-0.028em; text-wrap:balance; color:var(--ink); }
.statement .l2{ display:block; color:var(--ink-2); font-weight:400; letter-spacing:-0.022em; }

/* the live signal line — the telemetry motif, brand cyan */
.sig{ width:100%; max-width:520px; height:34px; display:block; }
.sig .line{ fill:none; stroke:var(--signal); stroke-width:1.5; }
.sig .grid{ stroke:var(--rule); stroke-width:1; }
.sig .node{ fill:var(--signal); }

.lede{ margin:0; max-width:58ch; font-size:var(--fs-lede); line-height:1.55; color:var(--muted); }
.cta-row{ margin:0; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.cta{ font-family:var(--font); font-weight:600; font-size:var(--fs-lede); color:var(--ink);
  text-decoration:none; border-bottom:1px solid var(--signal); padding-bottom:2px; }
.cta:hover{ color:var(--signal); }
.cta:focus-visible{ outline:3px solid var(--signal); outline-offset:4px; }
.cta-note{ font-family:var(--mono); font-size:var(--fs-meta); color:var(--muted); }

.foot{ margin-top:auto; padding:clamp(20px,3vw,34px) var(--pad-m) 0;
  border-top:1px solid var(--rule); display:flex; align-items:flex-end;
  justify-content:space-between; gap:18px; }
.foot .seq{ font-family:var(--mono); font-size:var(--fs-meta); color:var(--muted);
  letter-spacing:0.02em; }
/* the dot wordmark, masked verbatim from assets/logo-titik.svg (never redrawn) */
.mark{ display:block; }
.mark svg{ display:block; width:clamp(94px,11.5vw,146px); height:auto; }
.mark [fill="#F2F5F7"]{ fill:var(--mark-ink); }

@media (min-width:940px){
  .grid{ grid-template-columns:minmax(0,4fr) minmax(0,8fr); align-items:stretch; }
  .rail{ align-self:stretch; border-right:1px solid var(--rule);
    padding-right:var(--gut); }
  .rail-row.status{ margin-top:auto; }
  .lead{ align-self:end; }
  .ruler .ticks{ width:min(30vw,360px); }
}
</style>
</head>

    <span class="rl">aurel</span>
    <span class="rl rt">salinan posisi</span>
  </div>

  <div class="stage">
    <div class="grid">

      <aside class="rail" aria-label="Status salinan">
        <div class="rail-row"><span class="k">Sumber</span><span class="leader"></span><span class="v">1</span></div>
        <div class="rail-row"><span class="k">Akun</span><span class="leader"></span><span class="v">Anda</span></div>

        <div class="rail-row status"><span class="dot" aria-hidden="true"></span><span class="k">Status</span><span class="leader"></span><span class="v">Jalan</span></div>
      </aside>

      <div class="lead">
        <h1 class="statement">Posisi jalan<span class="l2">tanpa Anda nunggu sinyal.</span></h1>

        <svg class="sig" viewBox="0 0 520 34" role="img" aria-label="Garis sinyal">
          <line class="grid" x1="0" y1="17" x2="520" y2="17"></line>
          <polyline class="line" points="0,24 60,22 120,25 180,15 240,19 300,10 360,13 420,7 480,9 520,6"></polyline>
          <circle class="node" cx="520" cy="6" r="3.4"></circle>
        </svg>

        <p class="lede">Aurel menyalin setiap posisi dari satu sumber ke akun Anda, dengan ukuran dan batas rugi yang Anda tetapkan sendiri.</p>
        <p class="cta-row">
          <a class="cta" href="[TELEGRAM_URL_PLACEHOLDER]">Sertai saluran Telegram</a>
          <span class="cta-note">Percuma, tanpa borang.</span>
        </p>
      </div>

    </div>
  </div>
